<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Todo application</title>
</head>
<body>
    <h1>Todo List</h1>
    <form action="add/" method="post">
        {% csrf_token %}
        <input type="text" name="content">
        <input type="submit" value="save">
    </form>

    <ul>
        {% for object in object_list %}
        <li>
            {{ object.content }}
            <form action="delete/{{object.pk}}" method="post">
                {% csrf_token %}
                <input type="submit" value="delete">
            </form>
        </li>
        {% endfor %}

    </ul>
</body>
</html>
